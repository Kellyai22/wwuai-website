<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Wise Women Use AI</title>
  <meta name="description" content="That page isn't here. Head back to the Wise Women Use AI homepage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:          #FAF8F6;
      --ink:         #3A131B;
      --bordeaux:    #3A131B;
      --driftwood:   #908486;
      --cream-dark:  #E1DAD7;
      --clay:        #DDA983;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 300;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    nav {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 48px;
      border-bottom: 1px solid var(--cream-dark);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo img { height: 32px; width: 32px; object-fit: contain; }
    .nav-wordmark {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--driftwood);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px 128px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--bordeaux);
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 6vw, 54px);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    h1 em { font-style: italic; color: var(--clay); }

    p {
      font-size: 15px;
      color: var(--driftwood);
      line-height: 1.75;
      margin-bottom: 40px;
    }

    .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    .btn-outline {
      display: inline-block;
      padding: 13px 28px;
      border: 1px solid var(--bordeaux);
      border-radius: 2px;
      color: var(--bordeaux);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .btn-outline:hover { background: var(--bordeaux); color: var(--bg); }

    .link-quiet {
      display: inline-flex;
      align-items: center;
      padding: 13px 8px;
      color: var(--driftwood);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .link-quiet:hover { color: var(--bordeaux); }

    @media (max-width: 768px) {
      nav { padding: 0 24px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="/assets/logos/WWUAI Logo OGTP.png" alt="Wise Women Use AI">
      <span class="nav-wordmark">Wise Women Use AI</span>
    </a>
  </nav>

  <main>
    <span class="eyebrow">404 · Page not found</span>
    <h1>Well, that page has <em>wandered off.</em></h1>
    <p>It might have moved, or the link might be a little older than the site. Either way, everything worth finding is still here.</p>
    <div class="actions">
      <a href="/" class="btn-outline">Back to the homepage</a>
      <a href="/blog" class="link-quiet">Or browse the blog</a>
    </div>
  </main>

</body>
</html>
